services:
  - type: web
    name: mira-backend
    runtime: python
    rootDir: backend
    plan: free

    buildCommand: pip install -r requirements2.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: DEBUG
        value: "false"

      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: MILVUS_ENABLED
        value: "false"

      - key: MODEL_AUTO_DOWNLOAD
        value: "false"

      - key: MODEL_HUB_ID
        value: "AshIndian/Mira.ai"

      - key: MIRA_MODEL_SERVER_URL
        sync: false

      - key: SEED_ADMIN_EMAIL
        sync: false

      - key: SEED_ADMIN_PASSWORD
        sync: false

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"